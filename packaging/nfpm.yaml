# nfpm: deb e rpm do aerographene (packaging/build-native.sh).
# Cabeçalho estático; `contents:` é gerado pelo script a partir da árvore do .pkg.tar.zst
# (mesmos arquivos e modos que o PKGBUILD instalou: /opt/aerographene, /usr/bin wrapper,
# desktop, MIME, ícones, licença; chrome-sandbox 4755). Variável: VERSION (X.Y.Z).
name: aerographene
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: web
priority: optional
maintainer: newcortexbr
description: |
  Navegador baseado em ungoogled-chromium (Chromium 154.0.8037.97).
  Série própria de patches sobre ungoogled-chromium, com partes do Helium.
vendor: newcortexbr
homepage: https://github.com/newcortexbr/aerographene
license: GPL-3.0-only

# Dependências por distro (espelham o depends do PKGBUILD). Alternativas `a | b` cobrem o
# sufixo t64 do Ubuntu 24.04 / Debian 13 e os nomes sem sufixo de Ubuntu 22.04.
overrides:
  deb:
    depends:
      - libnss3
      - libnspr4
      - libgtk-3-0t64 | libgtk-3-0
      - libasound2t64 | libasound2
      - libcups2t64 | libcups2
      - libatk1.0-0t64 | libatk1.0-0
      - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
      - libatspi2.0-0t64 | libatspi2.0-0
      - libdbus-1-3
      - libexpat1
      - libgbm1
      - libxkbcommon0
      - libx11-6
      - libxcb1
      - libxext6
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libxss1
      - libcairo2
      - libpango-1.0-0
      - libudev1
      - xdg-utils
      - fonts-liberation
      - hicolor-icon-theme
    suggests:
      - fonts-jetbrains-mono
  rpm:
    depends:
      - nss
      - nspr
      - gtk3
      - alsa-lib
      - cups-libs
      - atk
      - at-spi2-atk
      - at-spi2-core
      - dbus-libs
      - expat
      - mesa-libgbm
      - libxkbcommon
      - libX11
      - libxcb
      - libXext
      - libXcomposite
      - libXdamage
      - libXfixes
      - libXrandr
      - libXScrnSaver
      - cairo
      - pango
      - systemd-libs
      - xdg-utils
      - liberation-fonts
      - hicolor-icon-theme
    suggests:
      - jetbrains-mono-fonts

contents:
