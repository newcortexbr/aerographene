name: build

# ADR 0004: só o dono dispara. Nunca adicionar pull_request/pull_request_target.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "jobs do ninja: auto = nproc no container, ou número"
        default: "auto"
      target:
        description: "alvo do ninja: chrome = build completa + pacote; ou obj/<caminho>.o para validar um erro"
        default: "chrome"
      pgo:
        description: "1 = perfil PGO oficial; 0 = sem PGO"
        default: "1"
      cpu:
        description: "alvo de CPU: avx2 = x86-64-v3 (out/Default); avx1 = -march=ivybridge (out/Avx1, ccache próprio)"
        type: choice
        options: [avx2, avx1]
        default: avx2
      o3:
        description: "-O3 seletivo (docs/BUILD.md): off = build normal; hot = Blink platform+heap; wide = hot + base. Gera pacote -o3<perfil>"
        type: choice
        options: [off, hot, wide]
        default: off
  push:
    branches: [main]
    paths:
      - "build/**"
      - "patches/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # labels do runner "intense" da org newcortexbr; exatos não confirmados (ver docs/BUILD.md)
    runs-on: [self-hosted, linux, intense]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4

      - name: build
        env:
          JOBS: ${{ inputs.jobs || 'auto' }}
          NINJA_TARGET: ${{ inputs.target || 'chrome' }}
          AEROGRAPHENE_PGO: ${{ inputs.pgo || '1' }}
          AERO_CPU: ${{ inputs.cpu || 'avx2' }}
          AERO_O3: ${{ inputs.o3 || 'off' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: bash build/build.sh

      - name: localizar artefato
        if: ${{ (inputs.target || 'chrome') == 'chrome' }}
        id: art
        env:
          AERO_CPU: ${{ inputs.cpu || 'avx2' }}
          O3_TAG: ${{ (inputs.o3 && inputs.o3 != 'off') && format('-o3{0}', inputs.o3) || '' }}
        # o pacote recém-gerado é o mais novo; o sufixo -o3<perfil> fica antes do cpu no nome
        run: echo "path=$(ls -1t "${AEROGRAPHENE_WORKDIR:-$HOME/aerographene-build}"/dist/*${O3_TAG}-${AERO_CPU}-x86_64_linux.tar.zst | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ (inputs.target || 'chrome') == 'chrome' }}
        # cota de artefatos cheia não invalida a build; o pacote fica em dist/ no runner
        continue-on-error: true
        with:
          # avx2 mantém o nome histórico (smoke.yml, release.yml); avx1 leva sufixo
          name: ${{ inputs.cpu == 'avx1' && 'aerographene-linux-x86_64-avx1' || 'aerographene-linux-x86_64' }}${{ (inputs.o3 && inputs.o3 != 'off') && format('-o3{0}', inputs.o3) || '' }}
          path: ${{ steps.art.outputs.path }}
          compression-level: 0
          retention-days: 14

      # depois do upload: o artefato fica disponível mesmo se o smoke falhar
      - name: smoke test
        if: ${{ (inputs.target || 'chrome') == 'chrome' }}
        run: bash build/smoke.sh "${{ steps.art.outputs.path }}"
