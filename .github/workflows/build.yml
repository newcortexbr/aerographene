name: build

# ADR 0004: só o dono dispara. Nunca adicionar pull_request/pull_request_target.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "jobs do ninja: auto = nproc no container, ou número"
        default: "auto"
      pgo:
        description: "1 = perfil PGO oficial; 0 = sem PGO"
        default: "1"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "patches/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # labels do runner "intense" da org newcortexbr; exatos não confirmados (ver docs/BUILD.md)
    runs-on: [self-hosted, linux, intense]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4

      - name: build
        env:
          JOBS: ${{ inputs.jobs || 'auto' }}
          AEROGRAPHENE_PGO: ${{ inputs.pgo || '1' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: bash build/build.sh

      - name: localizar artefato
        id: art
        run: echo "path=$(ls -1 "${AEROGRAPHENE_WORKDIR:-$HOME/aerographene-build}"/dist/*.tar.zst | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aerographene-linux-x86_64
          path: ${{ steps.art.outputs.path }}
          compression-level: 0
          retention-days: 14

      # depois do upload: o artefato fica disponível mesmo se o smoke falhar
      - name: smoke test
        run: bash build/smoke.sh "${{ steps.art.outputs.path }}"
